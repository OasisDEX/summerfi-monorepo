query GetStrategies {
  strategies {
    id
    strategyId
    owner {
      id
    }
    sourceVault
    targetVault
    inAsset
    outAsset
    inAssetFeed
    outAssetFeed
    inAssetFeedStaleness
    outAssetFeedStaleness
    tradeAmount
    interval
    slippageBps
    maxPrice
    minPrice
    endDate
    maxTrades
    status
    nextTriggerAt
    lastScheduledAt
    createdAt
    updatedAt
    tradesExecuted
    totalInAssetSwapped
    totalOutAssetReceived
  }
}
