query GetRwaVaultNavHistory($vaultId: ID!) {
  # used in the RWA "Historical NAV price" chart - pricePerShare (NAV) over time
  vault(id: $vaultId) {
    id
    hourlyVaultHistory: hourlySnapshots(
      first: 721 # 30 days in hours + 1 point of leeway
      orderBy: timestamp
      orderDirection: desc
    ) {
      navPrice: pricePerShare
      timestamp
    }
    dailyVaultHistory: dailySnapshots(
      first: 366 # 1 year in days + 1 point of leeway
      orderBy: timestamp
      orderDirection: desc
    ) {
      navPrice: pricePerShare
      timestamp
    }
    weeklyVaultHistory: weeklySnapshots(
      first: 157 # 3 years in weeks + 1 point of leeway
      orderBy: timestamp
      orderDirection: desc
    ) {
      navPrice: pricePerShare
      timestamp
    }
  }
}
